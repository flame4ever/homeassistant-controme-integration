set_temporary_temperature:
  target:
    entity:
      integration: controme
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 5
          max: 30
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
activate_scene:
  target:
    entity:
      integration: controme
      domain: climate
  fields:
    scene_id:
      required: true
      selector:
        number:
          min: 1
          step: 1
          mode: box
    duration:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min
          mode: box
